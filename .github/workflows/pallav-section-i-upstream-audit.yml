name: Pallav Section I upstream audit

on:
  push:
    branches: [pallav]
    paths:
      - '.github/workflows/pallav-section-i-upstream-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pallav
          fetch-depth: 0
      - name: Build exact affected-file report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('architecture/L4_System_Behavior_Specification/01_Production/section-i')
          ranges=[(4,16),(43,54),(71,82),(118,132)]
          marker='Section_I_L3_Event_Integrity_and_Boundary_Remediation_Amendment_2026-09-03.md'
          rows=[]
          for p in sorted(root.glob('L4-I-*.md')):
              m=re.match(r'L4-I-(\d{3})_',p.name)
              if not m: continue
              n=int(m.group(1))
              if not any(a<=n<=b for a,b in ranges): continue
              t=p.read_text(encoding='utf-8')
              if marker in t or 'proposed L3 Section I remediation amendment' in t:
                  bh=[]
                  for line in t.splitlines():
                      if 'proposed L3 Section I remediation amendment' in line or marker in line:
                          bh.append(line.strip())
                  rows.append((n,p.name,bh))
          out=['# Pallav Section I exact upstream-remediation dependency audit','',f'Affected count: {len(rows)}','']
          for n,name,bh in rows:
              out.append(f'## L4-I-{n:03d} — {name}')
              out.extend(f'- {x}' for x in bh)
              out.append('')
          Path('.tmp_pallav_section_i_audit.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('affected',len(rows),[n for n,_,_ in rows])
          PY
          git rm .github/workflows/pallav-section-i-upstream-audit.yml
          git config user.name 'SutraERP Architecture Audit'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp_pallav_section_i_audit.md
          git commit -m 'Audit Pallav Section I upstream remediation dependencies'
          git push origin HEAD:pallav
