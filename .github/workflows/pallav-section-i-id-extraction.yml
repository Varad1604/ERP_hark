name: Pallav Section I affected ID extraction

on:
  push:
    branches: [pallav]
    paths:
      - '.github/workflows/pallav-section-i-id-extraction.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pallav
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('architecture/L4_System_Behavior_Specification/01_Production/section-i')
          ranges=[(4,16),(43,54),(71,82),(118,132)]
          marker='Section_I_L3_Event_Integrity_and_Boundary_Remediation_Amendment_2026-09-03.md'
          ids=[]
          for p in sorted(root.glob('L4-I-*.md')):
              m=re.match(r'L4-I-(\d{3})_',p.name)
              if not m: continue
              n=int(m.group(1))
              if any(a<=n<=b for a,b in ranges) and marker in p.read_text(encoding='utf-8'):
                  ids.append(f'I-{n:03d}')
          Path('.tmp_pallav_section_i_ids.txt').write_text(', '.join(ids)+'\n',encoding='utf-8')
          if len(ids)!=48: raise SystemExit(f'Expected 48, found {len(ids)}')
          PY
          git rm .github/workflows/pallav-section-i-id-extraction.yml
          git config user.name 'SutraERP Architecture Audit'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp_pallav_section_i_ids.txt
          git commit -m 'Record exact Pallav Section I affected IDs'
          git push origin HEAD:pallav
