name: L3 Final Corpus Lock Synchronization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/l3-final-corpus-lock.yml'
      - 'architecture/L3_Business_Scenario_Architecture/05_Phase5_Parallel_Authoring_and_Verification/L3_Final_Corpus_Lock_Decision_1084_2026-08-29.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock-l3-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize all canonical L3 scenario statuses
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('architecture/L3_Business_Scenario_Architecture/05_Phase5_Parallel_Authoring_and_Verification/01_Scenario_Documents')
          files = sorted(root.glob('section-*/*.md'))
          scenario_files = [p for p in files if re.match(r'L3-[A-J]-\d{3}_.*\.md$', p.name)]

          if len(scenario_files) != 1084:
              raise SystemExit(f'Expected 1084 canonical L3 scenario files, found {len(scenario_files)}')

          changed = 0
          failures = []

          for path in scenario_files:
              text = path.read_text(encoding='utf-8')
              original = text

              # Canonical metadata form used by the majority of L3 scenario files.
              text, n1 = re.subn(r'(?m)^\*\*Status:\*\*\s*[^\n]+$', '**Status:** Locked  ', text, count=1)

              # Some files reproduce status in the Scenario Metadata table.
              text, n2 = re.subn(r'(?m)^\| Status \| (?:Draft|Review|Architecture Approved|Architecture Locked|Locked) \|$', '| Status | Locked |', text)

              if n1 == 0:
                  failures.append(str(path))
                  continue

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed += 1

          if failures:
              raise SystemExit('Missing canonical **Status:** metadata in:\n' + '\n'.join(failures))

          print(f'Canonical scenario files validated: {len(scenario_files)}')
          print(f'Files changed to Locked: {changed}')

      - name: Verify corpus lock
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('architecture/L3_Business_Scenario_Architecture/05_Phase5_Parallel_Authoring_and_Verification/01_Scenario_Documents')
          scenario_files = sorted(p for p in root.glob('section-*/*.md') if re.match(r'L3-[A-J]-\d{3}_.*\.md$', p.name))
          unlocked = []
          for path in scenario_files:
              text = path.read_text(encoding='utf-8')
              if not re.search(r'(?m)^\*\*Status:\*\* Locked\s*$', text):
                  unlocked.append(str(path))
          if len(scenario_files) != 1084 or unlocked:
              raise SystemExit(f'Lock verification failed: files={len(scenario_files)}, unlocked={len(unlocked)}\n' + '\n'.join(unlocked))
          print('L3 CORPUS LOCK VERIFIED: 1084 / 1084')

      - name: Commit synchronized scenario metadata
        run: |
          if git diff --quiet; then
            echo 'No scenario metadata changes required.'
            exit 0
          fi
          git config user.name 'SutraERP Architecture Governance'
          git config user.email 'actions@users.noreply.github.com'
          git add architecture/L3_Business_Scenario_Architecture/05_Phase5_Parallel_Authoring_and_Verification/01_Scenario_Documents
          git commit -m 'governance: synchronize 1084 L3 scenarios to Locked'
          git push
