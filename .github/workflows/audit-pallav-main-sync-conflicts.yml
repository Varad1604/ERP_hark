name: Audit Pallav Main Sync Conflicts
on:
  push:
    branches: [tmp-pallav-main-sync-audit]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dry-run merge and record conflicts
        run: |
          git config user.name "SutraERP Architecture Sync Audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          mkdir -p generated/reviews
          {
            echo "# Pallav/Main Sync Conflict Audit — 2026-09-03"
            echo
            echo "Base branch: tmp-pallav-main-sync-audit"
            echo "Target upstream: origin/main"
            echo
            if [ $rc -eq 0 ]; then
              echo "## Result"
              echo "CLEAN MERGE — no conflicts."
            else
              echo "## Result"
              echo "MERGE CONFLICTS DETECTED"
              echo
              echo "## Conflicted Paths"
              git diff --name-only --diff-filter=U | sed 's/^/- `/' | sed 's/$/`/'
            fi
          } > generated/reviews/Pallav_Main_Sync_Conflict_Audit_2026-09-03.md
          git merge --abort || true
          git add generated/reviews/Pallav_Main_Sync_Conflict_Audit_2026-09-03.md
          git rm --cached .github/workflows/audit-pallav-main-sync-conflicts.yml || true
          rm -f .github/workflows/audit-pallav-main-sync-conflicts.yml
          git add -A
          git commit -m "Record pallav-main sync conflict audit"
          git push origin HEAD:tmp-pallav-main-sync-audit
# trigger
