name: Fix Section I direction dispositions
on:
  push:
    branches: [tmp-pallav-l3-i-47-review]
    paths: ['.github/workflows/fix-section-i-direction-dispositions.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-pallav-l3-i-47-review
          fetch-depth: 0
      - name: Correct exact direction dispositions and validate overlay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('architecture/L3_Business_Scenario_Architecture/05_Phase5_Parallel_Authoring_and_Verification/Section_I_L3_Event_Integrity_and_Boundary_Remediation_Amendment_2026-09-03.md')
          s=p.read_text(encoding='utf-8')
          fixes=[
          ('| L3-I-046 | L2-I06 | Published | `Candidate Information Updated` | **KEEP** |','| L3-I-046 | L2-I06 | Published | `Candidate Information Updated` | **REMOVE FROM EVENT CLASSIFICATION** |'),
          ('| L3-I-075 | L2-I08 | Published | `Examination Policy Updated` | **KEEP** |','| L3-I-075 | L2-I08 | Published | `Examination Policy Updated` | **REMOVE FROM EVENT CLASSIFICATION** |'),
          ('| L3-I-078 | L2-I08 | Published | `Practical Examination Completed` | **KEEP** |','| L3-I-078 | L2-I08 | Published | `Practical Examination Completed` | **REMOVE FROM EVENT CLASSIFICATION** |'),
          ('| L3-I-078 | L2-I08 | Published | `Theory Examination Completed` | **KEEP** |','| L3-I-078 | L2-I08 | Published | `Theory Examination Completed` | **REMOVE FROM EVENT CLASSIFICATION** |')]
          for old,new in fixes:
              if s.count(old)!=1: raise SystemExit(f'expected one row: {old}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit bounded correction
        shell: bash
        run: |
          set -euo pipefail
          A='architecture/L3_Business_Scenario_Architecture/05_Phase5_Parallel_Authoring_and_Verification/Section_I_L3_Event_Integrity_and_Boundary_Remediation_Amendment_2026-09-03.md'
          git rm -f .github/workflows/fix-section-i-direction-dispositions.yml
          git add "$A"
          git config user.name 'SutraERP Architecture Remediation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Correct Section I amendment event direction dispositions'
          git push origin HEAD:tmp-pallav-l3-i-47-review
